# main へのマージ（push）でテストを実行し、通ったら Fly.io にデプロイする。
# プルリクエストではテストのみ実行する。
# 事前に GitHub の Secrets に FLY_API_TOKEN（Fly.io のデプロイトークン）を登録しておくこと。
name: Test & Fly Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy-group # デプロイが同時に走らないようにする
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
